<h2 mat-dialog-title class="dialog-title">Retirar Asesor Técnico</h2>

<mat-dialog-content class="dialog-content">
  <p>
    ¿Está seguro que desea retirar a <strong>{{ data.advisorName }}</strong> del equipo de asesoría agronómica?
  </p>
  <p class="warning-text">Esta acción desvinculará la supervisión técnica sobre las parcelas asignadas.</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" (click)="onCancel()" class="btn-secondary">Cancelar</button>
  <button mat-flat-button type="button" (click)="onConfirm()" class="btn-danger">Retirar Asesor</button>
</mat-dialog-actions>
