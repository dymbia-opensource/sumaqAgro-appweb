<mat-form-field appearance="outline">
  <mat-label>{{ 'crop-health.change-plot' | translate }}</mat-label>
  <mat-select
    [value]="selectedPlotId()"
    [disabled]="disabled()"
    (selectionChange)="plotSelected.emit($event.value)"
  >
    @for (plot of plots(); track plot.id) {
      <mat-option [value]="plot.id">{{ plot.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>
