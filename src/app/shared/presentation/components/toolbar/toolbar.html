<mat-toolbar class="topbar">
  @if (layout.isHandset()) {
    <button
      mat-icon-button
      (click)="layout.toggleSidebar()"
      [attr.aria-label]="'layout.menu' | translate"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }

  <mat-form-field class="search" appearance="outline" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput type="search" [placeholder]="'layout.search' | translate" />
  </mat-form-field>

  <span class="spacer"></span>

  <mat-chip-set class="connection" [attr.aria-label]="'layout.connection' | translate">
    <mat-chip [highlighted]="layout.isOnline()" [disableRipple]="true">
      <mat-icon matChipAvatar>{{ layout.isOnline() ? 'cloud_done' : 'cloud_off' }}</mat-icon>
      {{ (layout.isOnline() ? 'layout.connected' : 'layout.disconnected') | translate }}
    </mat-chip>
  </mat-chip-set>

  <button
    mat-icon-button
    [matTooltip]="'layout.notifications' | translate"
    [attr.aria-label]="'layout.notifications' | translate"
  >
    <mat-icon
      aria-hidden="false"
      [matBadge]="notificationCount()"
      [matBadgeHidden]="notificationCount() === 0"
      matBadgeColor="warn"
      matBadgeSize="small"
      >notifications</mat-icon
    >
  </button>

  <button mat-button class="user-button" [matMenuTriggerFor]="userMenu">
    <mat-icon class="avatar">account_circle</mat-icon>
    <span class="user-name">{{ userName() }}</span>
    <mat-icon iconPositionEnd>expand_more</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <a mat-menu-item routerLink="/profiles/settings">
      <mat-icon>person</mat-icon>
      <span>{{ 'layout.profile' | translate }}</span>
    </a>
    <mat-divider />
    <button mat-menu-item (click)="layout.signOut()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'layout.sign-out' | translate }}</span>
    </button>
  </mat-menu>
</mat-toolbar>
