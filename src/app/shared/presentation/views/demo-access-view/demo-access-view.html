<main class="demo-access">
  <section class="demo-access__content">
    <div class="demo-access__brand">
      <span class="demo-access__brand-name">Sumaq<span>Agro</span></span>
      <p>Cultivating a better tomorrow</p>
    </div>

    <h1>Welcome to SumaqAgro</h1>
    <p class="demo-access__description">
      Choose an experience to explore the platform.
    </p>

    <div class="demo-access__users">
      @for (user of users; track user.id) {
        <mat-card class="demo-access__card">
          <mat-card-content>
            <mat-icon class="demo-access__icon">{{ roleIcon(user) }}</mat-icon>

            <div>
              <h2>{{ user.displayName }}</h2>
              <p>{{ roleLabel(user) }}</p>
            </div>

            <button
              mat-flat-button
              type="button"
              (click)="selectUser(user)"
              [attr.aria-label]="'Enter as ' + user.displayName"
            >
              Enter
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </mat-card-content>
        </mat-card>
      }
    </div>
  </section>
</main>
