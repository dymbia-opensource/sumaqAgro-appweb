<mat-chip-listbox
  [value]="selected() ?? 'ALL'"
  (change)="onChange($event.value)"
  [attr.aria-label]="'field-management.finances.filter' | translate"
>
  <mat-chip-option value="ALL">{{ 'field-management.finances.all-categories' | translate }}</mat-chip-option>
  @for (category of categories; track category) {
    <mat-chip-option [value]="category">
      <mat-icon matChipAvatar>{{ icons[category] }}</mat-icon>
      {{ 'field-management.expense-category.' + category | translate }}
    </mat-chip-option>
  }
</mat-chip-listbox>
