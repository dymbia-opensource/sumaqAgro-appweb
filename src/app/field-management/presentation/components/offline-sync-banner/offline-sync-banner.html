@if (!online() || pending() > 0) {
  <div class="banner" [class.offline]="!online()" role="status">
    <mat-icon aria-hidden="true">{{ online() ? 'cloud_sync' : 'cloud_off' }}</mat-icon>
    <p>
      @if (!online()) {
        {{ 'field-management.offline.no-connection' | translate }}
      }
      @if (pending() > 0) {
        {{ 'field-management.offline.pending' | translate: { count: pending() } }}
      }
    </p>
    @if (online() && pending() > 0) {
      <button mat-button [disabled]="syncing()" (click)="sync.emit()">
        <mat-icon>sync</mat-icon>
        {{
          (syncing() ? 'field-management.offline.syncing' : 'field-management.offline.sync-now')
            | translate
        }}
      </button>
    }
  </div>
}
