<mat-card appearance="outlined" class="map-card">
  <div
    #mapElement
    class="map"
    role="img"
    [attr.aria-label]="'field-management.plot-detail.map' | translate"
  ></div>
  @if (coordinates().length < 3) {
    <p class="empty">{{ 'field-management.plot-detail.no-polygon' | translate }}</p>
  }
</mat-card>
