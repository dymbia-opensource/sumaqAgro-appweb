@if (loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | translate" />
}

<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="'field-management.expense-form.title' | translate"
  [subtitle]="plot() ? ('field-management.expense-form.subtitle' | translate: { plot: plot()!.name }) : ''"
/>

@if (error(); as error) {
  <app-message-card icon="error" [message]="error | translate" [alert]="true" />
}

@if (canRecord()) {
  <mat-card appearance="outlined" class="form-card">
    <!-- Each tab is a route: /finances/expenses/new/inputs | labor | freight -->
    <nav mat-tab-nav-bar [tabPanel]="panel" [attr.aria-label]="'field-management.expense-form.types' | translate">
      @for (tab of tabs; track tab.category) {
        <a mat-tab-link [routerLink]="tab.link" routerLinkActive #link="routerLinkActive" [active]="link.isActive">
          <mat-icon>{{ icons[tab.category] }}</mat-icon>
          {{ 'field-management.expense-category.' + tab.category | translate }}
        </a>
      }
    </nav>
    <mat-tab-nav-panel #panel>
      <mat-card-content class="form-content">
        <app-field-expense-form
          [category]="category()"
          [saving]="loading()"
          (submitted)="onRecord($event)"
          (cancel)="onCancel()"
        />
      </mat-card-content>
    </mat-tab-nav-panel>
  </mat-card>
} @else if (!loading()) {
  <app-message-card
    icon="lock"
    [message]="(ledger() ? 'field-management.finances.ledger-closed' : 'field-management.finances.no-ledger') | translate"
  />
}
