@if (loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | translate" />
}

<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="'field-management.campaigns.new' | translate"
  [subtitle]="
    plot() ? ('field-management.campaigns.new-subtitle' | translate: { plot: plot()!.name }) : ''
  "
/>

@if (error(); as error) {
  <app-message-card icon="error" [message]="error | translate" [alert]="true" />
}

@if (!plot()) {
  @if (!loading()) {
    <app-message-card
      icon="grid_view"
      [message]="'field-management.finances.no-ledger' | translate"
    >
      <mat-card-actions align="end">
        <a mat-flat-button routerLink="/field-management/plots">
          {{ 'field-management.finances.select-plot' | translate }}
        </a>
      </mat-card-actions>
    </app-message-card>
  }
} @else if (hasCampaignInProgress()) {
  <!-- A plot cannot have two campaigns in progress -->
  <app-message-card
    icon="lock"
    [message]="'field-management.campaigns.one-in-progress' | translate"
    [alert]="true"
  >
    <mat-card-actions align="end">
      <button mat-stroked-button (click)="onCancel()">{{ 'common.back' | translate }}</button>
    </mat-card-actions>
  </app-message-card>
} @else {
  <mat-card appearance="outlined" class="form-card">
    <mat-card-content>
      <app-campaign-form
        [initialCropType]="previousCropType()"
        [saving]="loading()"
        (submitted)="onStart($event)"
        (cancel)="onCancel()"
      />
    </mat-card-content>
  </mat-card>
}
