@if (loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | translate" />
}

<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="greetingKey() | translate: { name: userName() }"
  [subtitle]="
    campaign()
      ? plotSummary() + ' | ' + ('field-management.dashboard.campaign' | translate) + ' ' + campaign()!.season
      : plotSummary()
  "
>
  <a mat-flat-button class="view-plots" routerLink="/field-management/plots">
    <mat-icon>grid_view</mat-icon>
    {{ 'field-management.dashboard.view-all-plots' | translate }}
  </a>
</app-page-header>

@if (error()) {
  <app-message-card
    icon="cloud_off"
    [message]="'field-management.dashboard.load-error' | translate"
    [alert]="true"
  >
    <mat-card-actions align="end">
      <button mat-button (click)="retry()">
        <mat-icon>refresh</mat-icon>
        {{ 'common.retry' | translate }}
      </button>
    </mat-card-actions>
  </app-message-card>
} @else if (!loading() && plots().length === 0) {
  <app-message-card
    icon="agriculture"
    [message]="'field-management.dashboard.no-plots' | translate"
  >
    <mat-card-actions align="end">
      <a mat-flat-button routerLink="/field-management/plots/new">
        <mat-icon>add</mat-icon>
        {{ 'field-management.dashboard.register-plot' | translate }}
      </a>
    </mat-card-actions>
  </app-message-card>
} @else {
  <app-campaign-kpi-cards
    [attr.aria-label]="'field-management.dashboard.summary' | translate"
    role="region"
    [campaign]="campaign()"
    [ledger]="ledger()"
    [observation]="latestObservation()"
    [satelliteLoading]="observationsLoading()"
    [satelliteError]="observationsError()"
  />

  <section class="charts-grid">
    <app-ndvi-chart-card
      [observations]="observations()"
      [sowingDate]="campaign()?.sowingDate"
      [loading]="observationsLoading()"
      [error]="observationsError()"
    />
    <app-cost-distribution-card [ledger]="ledger()" />
  </section>
}
