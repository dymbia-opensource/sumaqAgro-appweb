@if (loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | translate" />
}

<app-page-header
  [breadcrumbs]="breadcrumbs()"
  [title]="'field-management.soil.title' | translate"
  [subtitle]="plot() ? ('field-management.soil.subtitle' | translate: { plot: plot()!.name }) : ''"
/>

@if (error(); as error) {
  <app-message-card icon="error" [message]="error | translate" [alert]="true" />
}

@if (plot(); as plot) {
  <mat-card appearance="outlined" class="form-card">
    <mat-card-content>
      <app-soil-baseline-form
        [current]="plot.soilBaseline"
        [saving]="loading()"
        (submitted)="onRecord($event)"
        (cancel)="onCancel()"
      />
    </mat-card-content>
  </mat-card>
} @else if (!plotsLoading()) {
  <app-message-card
    icon="search_off"
    [message]="'field-management.plot-detail.not-found' | translate"
  >
    <mat-card-actions align="end">
      <a mat-flat-button routerLink="/field-management/plots">
        {{ 'field-management.finances.select-plot' | translate }}
      </a>
    </mat-card-actions>
  </app-message-card>
}
