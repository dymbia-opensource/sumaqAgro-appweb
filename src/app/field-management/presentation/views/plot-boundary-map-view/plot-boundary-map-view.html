@if (loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | translate" />
}

<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="('field-management.boundary.title' | translate) + ': ' + plotTitle()"
  [subtitle]="'field-management.boundary.subtitle' | translate"
  [compact]="true"
/>

<app-registration-steps [current]="2" />

@if (error(); as error) {
  <app-message-card icon="error" [message]="error | translate" [alert]="true" />
}

<div class="map-layout">
  <!-- Satellite map (US-30) -->
  <app-plot-boundary-map
    [coordinates]="markedCoordinates()"
    [status]="polygonStatus()"
    (vertexAdded)="onAddVertex($event)"
  />

  <!-- Delineation summary (US-29) -->
  <app-boundary-summary-panel
    [plot]="plot()"
    [campaign]="campaign()"
    [coordinates]="markedCoordinates()"
    [areaHectares]="areaHectares()"
    [status]="polygonStatus()"
    [saving]="loading()"
    (undo)="onUndo()"
    (clear)="onClear()"
    (save)="onSavePlot()"
  />
</div>
