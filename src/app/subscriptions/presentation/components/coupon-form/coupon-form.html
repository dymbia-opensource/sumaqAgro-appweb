<form (ngSubmit)="onSubmit()" class="coupon-form">
  <mat-form-field appearance="outline">
    <mat-label>{{ 'subscriptions.checkout.coupon-label' | translate }}</mat-label>
    <input matInput [formControl]="couponCode" autocomplete="off" />
    @if (couponCode.hasError('required') && couponCode.touched) {
      <mat-error>{{ 'subscriptions.checkout.coupon-required' | translate }}</mat-error>
    }
  </mat-form-field>
  <button mat-stroked-button type="submit" [disabled]="disabled()">
    {{ 'subscriptions.checkout.apply-coupon' | translate }}
  </button>
</form>
